aid: milaboratories
name: Milaboratories
description: >-
  MiLaboratories builds best-in-class software for immunological and genomic
  data analysis. Its flagship product, MiXCR, is the gold-standard command-line
  platform for analysis of Next-Generation Sequencing (NGS) data for immune
  profiling — extracting T-cell receptor (TCR) and immunoglobulin (IG/antibody)
  repertoires from raw sequencing reads through alignment, clonotype assembly,
  and export — and is used widely across pharma R&D for vaccine development,
  CAR-T therapy, and antibody discovery. The company also builds Platforma.bio,
  a UI-first, no-code computational-biology platform for NGS data whose
  interactive blocks are built with the TypeScript Platforma SDK over the
  Platform API. MiLaboratories offers its software free for academic and
  non-commercial use with commercial licensing for industry. This profile was
  surfaced as a portfolio company of Speedinvest and enriched by the API
  Evangelist pipeline.
