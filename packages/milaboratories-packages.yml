    registry: npm
    name: "@milaboratories/pl-client"
    url: https://www.npmjs.com/package/@milaboratories/pl-client
    install: npm install @milaboratories/pl-client
    version: 3.14.3
    description: New TS/JS client for the Platforma Platform API.
    official: true
  - language: javascript
