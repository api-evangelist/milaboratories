notes: >-
  MiLaboratories ships its developer surface as the Platforma SDK (a
  TypeScript/JavaScript toolchain for building interactive Platforma blocks over
  the Platform API) plus MiXCR, a command-line immune-repertoire analyzer. The
  npm packages below are first-party, published under the @milaboratories and
  @platforma-sdk scopes. MiXCR itself is distributed as a JVM binary and Docker
  image via GitHub releases (catalogued as the CLI in cli/).
packages:
